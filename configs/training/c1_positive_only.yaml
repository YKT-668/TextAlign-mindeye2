name: c1_positive_only
source: Final14 ablation mapping
env:
  MINDEYE_TEXTALIGN: "1"
  MINDEYE_TEXTALIGN_STAGE: "1"
  MINDEYE_TEXTALIGN_HARDNEG: "0"
  MINDEYE_TEXTALIGN_HARD_SCALE: "0"
  MINDEYE_TEXTALIGN_MARGIN: "0.1"
command:
  - python
  - src/train_textalign_bplan_fixed.py
  - --model_name
  - c1_positive_only
  - --subj
  - "1"
  - --num_sessions
  - "40"
  - --batch_size
  - "32"
  - --num_epochs
  - "120"
  - --use_prior
  - --hidden_dim
  - "4096"
  - --multisubject_ckpt
  - checkpoints/shared_stage0
