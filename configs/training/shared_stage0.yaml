name: shared_stage0
source: Final14 trainer stage semantics
status: author_confirmation_required
note: Derived from trainer stage semantics because readme3 labels a repair command Stage0 while setting stage 1.
env:
  MINDEYE_TEXTALIGN: "1"
  MINDEYE_TEXTALIGN_STAGE: "0"
  MINDEYE_TEXTALIGN_HARDNEG: "0"
  MINDEYE_LR_BACKBONE: "0"
  MINDEYE_LR_PRIOR: "0"
  MINDEYE_LR_RIDGE: "0"
  MINDEYE_LR_TEXT: "3e-4"
command:
  - python
  - src/train_textalign_bplan_fixed.py
  - --model_name
  - shared_stage0
  - --subj
  - "1"
  - --num_sessions
  - "40"
  - --batch_size
  - "32"
  - --num_epochs
  - "30"
  - --no-use_prior
  - --max_lr
  - "3e-4"
  - --ckpt_interval
  - "5"
  - --no-wandb_log
  - --hidden_dim
  - "4096"
  - --multisubject_ckpt
  - checkpoints/final_multisubject_subj01
  - --drop_ridge_on_load
