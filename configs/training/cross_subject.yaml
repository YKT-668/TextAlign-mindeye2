name: cross_subject
source: Final14 S1/S2/S5/S7 protocol
env:
  MINDEYE_TEXTALIGN: "1"
  MINDEYE_TEXTALIGN_STAGE: "1"
  MINDEYE_TEXTALIGN_HARDNEG: "1"
command:
  - python
  - src/train_textalign_bplan_fixed.py
  - --model_name
  - cross_subject_s1_s2_s5_s7
  - --multi_subject
  - --train_subjs
  - 1,2,5,7
  - --test_subjs
  - 1,2,5,7
  - --batch_size
  - "32"
  - --num_epochs
  - "120"
  - --use_prior
  - --hidden_dim
  - "4096"
  - --textalign_hardneg_path
  - data/nsd_text/train_coco_captions_hard_negs_clip.pt
