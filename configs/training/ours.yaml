name: conceptalign_ours
source: src/readme3.md stage1 command at archive/final14
status: verified
env:
  MINDEYE_DTYPE: bf16
  MINDEYE_TEXTALIGN: "1"
  MINDEYE_TEXTALIGN_STAGE: "1"
  MINDEYE_TEXTALIGN_HARDNEG: "1"
  MINDEYE_TEXTALIGN_HARD_SCALE: "0.3"
  MINDEYE_TEXTALIGN_MARGIN: "0.1"
  MINDEYE_LR_BACKBONE: "1e-5"
  MINDEYE_LR_PRIOR: "1e-5"
  MINDEYE_LR_RIDGE: "1e-4"
  MINDEYE_LR_TEXT: "1e-4"
command:
  - accelerate
  - launch
  - --mixed_precision
  - bf16
  - --num_processes
  - "1"
  - --main_process_port
  - "29500"
