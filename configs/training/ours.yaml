  - --model_name
  - s1_textalign_stage1_FINAL_BEST_32
  - --subj
  - "1"
  - --num_sessions
  - "40"
  - --batch_size
  - "32"
  - --num_epochs
  - "120"
  - --use_prior
  - --lr_scheduler_type
  - linear
  - --max_lr
  - "1e-4"
  - --ckpt_interval
  - "1"
  - --no-wandb_log
  - --hidden_dim
  - "4096"
  - --textalign_hardneg_path
  - data/nsd_text/train_coco_captions_hard_negs_clip.pt
  - --multisubject_ckpt
  - checkpoints/shared_stage0
