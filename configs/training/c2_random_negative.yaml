name: c2_random_negative
source: Final14 ablation mapping
env:
  MINDEYE_TEXTALIGN: "1"
  MINDEYE_TEXTALIGN_STAGE: "1"
  MINDEYE_TEXTALIGN_HARDNEG: "1"
  MINDEYE_TEXTALIGN_HARD_SCALE: "0.3"
  MINDEYE_TEXTALIGN_MARGIN: "0.1"
command:
  - python
  - src/train_textalign_bplan_fixed.py
  - --model_name
  - c2_random_negative
  - --subj
  - "1"
  - --num_sessions
  - "40"
  - --batch_size
  - "32"
  - --num_epochs
  - "120"
  - --use_prior
  - --hidden_dim
  - "4096"
  - --textalign_hardneg_path
  - data/nsd_text/train_coco_captions_random_negs_clip.pt
  - --multisubject_ckpt
  - checkpoints/shared_stage0
